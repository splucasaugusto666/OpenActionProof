name: Python CI
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests without remote dependencies
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Run reproducible demonstration
        run: PYTHONPATH=src python -m openactionproof demo --output evidence/generated
      - name: Check receipts
        run: |
          for file in evidence/generated/*.json; do
            PYTHONPATH=src python -m openactionproof verify-receipt "$file"
          done

      - name: HTTP conformance benchmark
        run: PYTHONPATH=src python -m openactionproof.http_lab --output evidence/generated/http-benchmark.json

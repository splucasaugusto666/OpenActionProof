name: Research preview packaging
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  installed-wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Install exact local wheel
        run: python -m pip install --no-index --no-deps --find-links dist open-action-proof==0.9.0rc1
      - name: Test installed package outside source tree
        run: python scripts/smoke_installed.py
  inspect-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and pinned optional Inspect AI
        run: python -m pip install . inspect-ai==0.3.292
      - name: Execute controlled evaluation without model API
        env:
          INSPECT_DISABLE_MODEL_API: '1'
        run: python integrations/inspect_ai_smoke.py
  public-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional public-key extension
        run: python -m pip install ".[public-evidence]"
      - name: Require and test public-key support
        run: |
          python -c "import openactionproof.public_observation"
          python -m unittest discover -s tests -p test_public_observation.py -v

[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "open-action-proof"
version = "0.1.0"
description = "Independent outcome verification and evidence receipts for AI agent actions"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Project Genesis X contributors"}]
keywords = ["ai-agents", "verification", "reliability", "evidence"]

[project.scripts]
oap = "openactionproof.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
